
substitutions:
  ssid: !secret wifi__iot2_ssid
  ssidpassword: !secret wifi_iot2_password
  apipassword: !secret api_password
  otapassword: !secret ota_password
  friendly_name: ivt495

esphome:
  name: ivt495
  platform: ESP8266
  board: d1_mini_pro
  includes:
    - my_custom_ivt_reader.h

wifi:
  ssid: ${ssid}
  password: ${ssidpassword}
  ap:
    ssid: "ivt495"
    password: "123456789"

captive_portal:

logger:
  baud_rate: 0

api:
  password: ${apipassword}

ota:
  password: ${otapassword}

uart:
  id: uart_bus
  tx_pin: D6         # Not used
  rx_pin: D5         # Connect RX from IVT
  rx_buffer_size: 512
  baud_rate: 9600
  debug:
    direction: BOTH
    after:
      timeout: 30s
    sequence:
      - lambda: UARTDebug::log_string(direction, bytes);

sensor:
  - platform: custom
    lambda: |-
      auto ivt = new Ivt495Twin(id(uart_bus), {});
      return {ivt};
    sensors:
      - name: "Framledning"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: "Ute"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: "Tappvarmvatten Topp"
        unit_of_measurement: "°C"
